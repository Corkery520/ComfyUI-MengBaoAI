[project]
name = "mengbaoai"
version = "1.0.0"
description = "萌宝AI ComfyUI 综合节点包，集成图像生成、提示词管理与图像处理能力。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["dependencies"]
keywords = [
    "ComfyUI",
    "萌宝AI",
    "MengBaoAI",
    "image-generation",
    "image-processing",
    "prompt-management",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/Corkery520/ComfyUI-MengBaoAI"
Documentation = "https://github.com/Corkery520/ComfyUI-MengBaoAI#readme"
"Bug Tracker" = "https://github.com/Corkery520/ComfyUI-MengBaoAI/issues"

[tool.comfy]
PublisherId = "corkery520"
DisplayName = "萌宝AI ComfyUI 综合节点包"
