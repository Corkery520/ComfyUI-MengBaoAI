[project]
name = "mengbaoai"
version = "1.0.0"
description = "MengBaoAI | 萌宝AI ComfyUI 综合节点套件：图像生成、图片复刻、电商设置、提示词库、素材库、历史记录和图像处理。Image generation, replication, e-commerce and image tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["dependencies"]
keywords = [
    "ComfyUI",
    "萌宝AI",
    "MengBaoAI",
    "image-generation",
    "image-processing",
    "ecommerce",
    "prompt-management",
    "image-replication",
    "material-library",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/Corkery520/ComfyUI-MengBaoAI"
Documentation = "https://github.com/Corkery520/ComfyUI-MengBaoAI#readme"
"Bug Tracker" = "https://github.com/Corkery520/ComfyUI-MengBaoAI/issues"

[tool.comfy]
PublisherId = "corkery520"
DisplayName = "MengBaoAI · 萌宝AI 综合节点套件"
