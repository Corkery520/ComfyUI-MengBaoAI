[project]
name = "mengbao-image-api"
version = "1.0.0"
description = "萌宝AI (MengBao Image API) custom nodes for image generation and editing in ComfyUI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["dependencies"]
keywords = ["ComfyUI", "萌宝AI", "MengBao", "image-generation", "image-editing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/Corkery520/ComfyUI-MengBao-Image-API"
Documentation = "https://github.com/Corkery520/ComfyUI-MengBao-Image-API#readme"
"Bug Tracker" = "https://github.com/Corkery520/ComfyUI-MengBao-Image-API/issues"

[tool.comfy]
PublisherId = "corkery520"
DisplayName = "萌宝AI"
