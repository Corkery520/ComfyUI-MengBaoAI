<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MengBao Replica QA</title>
<style>
  body { margin: 20px; background: #202224; color: #ddd; font: 14px Arial; }
  main { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .qa-node { width: 360px; box-sizing: border-box; background: #333; border: 1px solid #666; border-radius: 8px; padding: 12px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  #locale { margin-bottom: 15px; padding: 8px; background: #333; color: white; }
  #qa-result { white-space: pre-wrap; }
</style>
<select id="locale" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="fr">Français</option></select>
<main id="nodes"></main><pre id="qa-result"></pre>
<script type="module">
  import { app } from '/scripts/app.js';
  import { configure } from '/extensions/mengbao/js/replica.js';
  for (const type of ['MengBaoImageReverse', 'MengBaoImageReplicaSettings', 'MengBaoReplicaAudit']) {
    const id = app.graph._nodes.length + 2;
    const root = document.createElement('section'); root.className = 'qa-node'; root.dataset.type = type;
    const title = document.createElement('h2'); root.append(title); document.querySelector('#nodes').append(root);
    const node = { id, type, size: [360, 400], inputs: type === 'MengBaoImageReplicaSettings' ? [{name: 'analysis', link: 10}] : [{name:'image'}],
      outputs: type === 'MengBaoImageReplicaSettings' ? [{name:'prompt'}, {name:'replica_settings', links: []}] : [{name:'analysis'}, {name:'reverse_prompt'}],
      widgets: ['request_id', 'draft_json', 'draft_id'].map(name => ({name, value:''})),
      addDOMWidget(name, type, element) { root.append(element); }, setSize() {}, computeSize() { return [360,400]; }, setDirtyCanvas() { title.textContent = this.title; } };
    app.graph._nodes.push(node); configure(node);
  }
  document.querySelector('#locale').addEventListener('change', () => app.ui.settings.settingsLookup['Comfy.Locale'].onChange());
  app.extensions[0].setup();
  window.qaNodes = app.graph._nodes;
</script>
</html>
