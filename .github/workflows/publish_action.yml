name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

concurrency:
  group: publish-comfy-registry
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require Registry publishing token
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::REGISTRY_ACCESS_TOKEN is not configured. No Registry version has been published."
            echo "Configure a Registry publisher token in repository Actions secrets, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  publish-node:
    name: Publish validated node pack
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"
      - name: Record submission
        shell: bash
        run: |
          echo "Registry upload completed. Verify the version is Active and has an install download URL before announcing availability in Manager." >> "$GITHUB_STEP_SUMMARY"
