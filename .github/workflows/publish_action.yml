name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: publish-comfy-registry
  cancel-in-progress: false

jobs:
  publish-node:
    name: Validate and publish custom node
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Registry metadata
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          root = pathlib.Path(".")
          metadata = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          project = metadata["project"]
          comfy = metadata["tool"]["comfy"]

          assert project["name"] == "mengbao-image-api"
          assert re.fullmatch(r"\d+\.\d+\.\d+", project["version"])
          assert "萌宝AI" in project["description"]
          assert project["urls"]["Repository"] == "https://github.com/Corkery520/ComfyUI-MengBao-Image-API"
          assert comfy["PublisherId"] == "corkery520"
          assert comfy["DisplayName"] == "萌宝AI"
          assert "dependencies" in project["dynamic"]

          required_paths = [
              "__init__.py",
              "MengBao_image_api_nodes.py",
              "requirements.txt",
              "README.md",
              "LICENSE",
              "web/MengBao_image_api_nodes_v4.js",
              "locales/en/nodeDefs.json",
              "locales/zh/nodeDefs.json",
          ]
          missing = [path for path in required_paths if not (root / path).is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")
          PY

      - name: Run basic checks
        shell: bash
        run: |
          python -m py_compile __init__.py MengBao_image_api_nodes.py tests/test_mengbao_image_api_nodes.py
          node --check web/MengBao_image_api_nodes_v4.js
          node tests/test_frontend_localization.mjs

      - name: Check Registry security rules
        shell: bash
        run: |
          if grep -R -n -E '(^|[^A-Za-z_])(eval|exec)[[:space:]]*\(' --include='*.py' --exclude-dir='.git' .; then
            echo "Registry-prohibited eval/exec call detected."
            exit 1
          fi
          if grep -R -n -E '(subprocess|os\.system).*(pip|pip3)[[:space:]]+install' --include='*.py' --exclude-dir='.git' .; then
            echo "Registry-prohibited runtime package installation detected."
            exit 1
          fi

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
